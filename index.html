<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A 10-minute game about one chaotic day in Hong Kong: MTR seat wars, cha chaan teng slang, yum cha carts, Mong Kok drips, minibus shouting and nano flats.">
<meta property="og:title" content="Hong Kong Speedrun">
<meta property="og:description" content="Six rounds of one ordinary day in the world's most efficient city. Aunties included.">
<title>Hong Kong Speedrun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+HK:wght@400;500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --ink:#120c1c; --panel:rgba(20,13,32,.95); --red:#ff3355; --jade:#19c39a;
    --cyan:#43d9ff; --amber:#ffb627; --cream:#f5ead0; --dim:#a597bf;
  }
  html,body{height:100%}
  body{background:var(--ink);color:var(--cream);font-family:"Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;overflow:hidden;padding-inline:16px;box-sizing:border-box}
  #app{height:100%;display:grid;place-items:center}
  #wrap{position:relative;container-type:size;max-width:100%}
  canvas{display:block;width:100%;height:100%;border-radius:14px;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 0 0 1px #ffffff14,0 20px 60px #000a}
  .ov{position:absolute;inset:0;display:grid;place-items:center;padding:4cqw;box-sizing:border-box;background:rgba(10,6,18,.55);border-radius:14px}
  .ov[hidden]{display:none}
  .card{width:100%;max-height:100%;overflow:auto;box-sizing:border-box;background:var(--panel);border:.4cqw solid var(--red);border-radius:3cqw;padding:5.5cqw 6cqw;box-shadow:0 0 5cqw rgba(255,51,85,.35),inset 0 0 3cqw rgba(255,51,85,.12);display:flex;flex-direction:column;gap:2.6cqw}
  .eyebrow{font:400 2.8cqw/1.2 "Share Tech Mono",ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin:0}
  h1{font:400 11cqw/.92 "Bungee","Arial Black",Impact,sans-serif;color:#ffe3e8;margin:0;text-shadow:0 0 1cqw #ff3355,0 0 3cqw #ff3355,0 0 7cqw rgba(255,51,85,.6);animation:flick 7s infinite}
  h2{font:400 7.2cqw/1.02 "Bungee","Arial Black",Impact,sans-serif;color:var(--cream);margin:0;text-wrap:balance}
  .lede{font:500 3.5cqw/1.45 "Noto Sans HK",system-ui,sans-serif;margin:0;color:var(--cream)}
  .how{font:400 3.15cqw/1.55 "Noto Sans HK",system-ui,sans-serif;color:var(--dim);margin:0;border-top:1px dashed #ffffff26;padding-top:2.4cqw}
  .how b{color:var(--cream);font-weight:700}
  .day{list-style:none;margin:0;padding:0;display:grid;gap:.5cqw}
  .day li{border-bottom:1px solid #ffffff12}
  .day button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:12cqw 1fr auto auto;align-items:baseline;gap:2cqw;font-size:3.4cqw;padding:.6cqw 1.2cqw;border-radius:1.4cqw;color:var(--cream)}
  .day button:hover,.day button:focus-visible{background:#ff335522}
  .day button:focus-visible{outline:.5cqw solid var(--cyan)}
  .day .solo{font:400 2.6cqw 'Share Tech Mono',ui-monospace,monospace;color:var(--red);letter-spacing:.06em}
  .clk{font-family:"Share Tech Mono",ui-monospace,monospace;color:var(--amber);font-variant-numeric:tabular-nums}
  .zh{color:var(--dim)}
  .row{display:flex;gap:2.4cqw;flex-wrap:wrap;margin-top:1cqw}
  .btn{font:700 3.6cqw/1.1 "Noto Sans HK",system-ui,sans-serif;padding:3.2cqw 4.4cqw;border-radius:2cqw;border:0;cursor:pointer}
  .btn.primary{background:var(--red);color:#fff;flex:1;box-shadow:0 .8cqw 0 #9b1430}
  .btn.primary:active{transform:translateY(.6cqw);box-shadow:0 .2cqw 0 #9b1430}
  .btn.ghost{background:transparent;color:var(--cream);border:.3cqw solid #ffffff33}
  .btn:focus-visible{outline:.6cqw solid var(--cyan);outline-offset:.6cqw}
  .meta{display:flex;justify-content:space-between;align-items:baseline}
  .clk.big{font-size:9cqw}
  .rnd{font:400 3cqw "Share Tech Mono",ui-monospace,monospace;color:var(--dim)}
  .zhbig{font:900 5cqw/1 "Noto Sans HK",system-ui,sans-serif;color:var(--red);margin:0}
  .score{display:flex;align-items:baseline;gap:1.5cqw}
  .score .n{font:400 16cqw/1 "Bungee","Arial Black",sans-serif;color:var(--amber);font-variant-numeric:tabular-nums}
  .score .d{font:400 3.6cqw "Share Tech Mono",ui-monospace,monospace;color:var(--dim)}
  .stats{font:400 3.1cqw/1.5 "Share Tech Mono",ui-monospace,monospace;color:var(--cyan);margin:0}
  .verdict{font:600 3.8cqw/1.45 "Noto Sans HK",system-ui,sans-serif;color:var(--cream);margin:0}
  .small{font-size:2.9cqw;color:var(--dim);margin:0}
  .bars{list-style:none;margin:0;padding:0;display:grid;gap:1.4cqw}
  .bars li{display:grid;grid-template-columns:1fr 26cqw 7cqw;gap:2cqw;align-items:center;font-size:3cqw}
  .bars b{text-align:right;font-family:"Share Tech Mono",ui-monospace,monospace;color:var(--amber)}
  .bar{height:2cqw;background:#ffffff14;border-radius:1cqw;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--jade),var(--amber))}
  .rank{color:var(--amber)}
  @keyframes flick{0%,91%,100%{opacity:1}92%{opacity:.35}93%{opacity:1}95%{opacity:.6}96%{opacity:1}}
  @media (prefers-reduced-motion:reduce){h1{animation:none}}
  [hidden]{display:none!important}
  body{margin:0}
</style>
</head>
<body>

<div id="app"><div id="wrap"><canvas id="c" aria-label="Hong Kong Speedrun game"></canvas><div id="ov" class="ov"></div></div></div>

<script>
(()=>{
'use strict';
const W=540,H=720;
const C={red:'#ff3355',pink:'#ff4fa3',jade:'#19c39a',cyan:'#43d9ff',amber:'#ffb627',cream:'#f5ead0',dim:'#a597bf'};
const DISP='"Bungee","Arial Black",Impact,sans-serif';
const BODY='"Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif';
const MONO='"Share Tech Mono",ui-monospace,Menlo,monospace';
const EMO='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

const cvs=document.getElementById('c');
let ctx=cvs.getContext('2d');
const wrap=document.getElementById('wrap'), ov=document.getElementById('ov');
let viewK=1;
function fit(){
  const aw=Math.max(220,innerWidth-32), ah=Math.max(290,innerHeight-24);
  const s=Math.min(aw/W,ah/H), dpr=Math.min(2.5,devicePixelRatio||1);
  wrap.style.width=W*s+'px'; wrap.style.height=H*s+'px';
  cvs.width=Math.round(W*s*dpr); cvs.height=Math.round(H*s*dpr); viewK=s*dpr;
}
addEventListener('resize',fit); fit();

// ---------- helpers ----------
const rand=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function emo(ch,x,y,s){ctx.font=`${s}px ${EMO}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ch,x,y);}
function txt(s,x,y,size,color,align='center',font=BODY,weight=700){ctx.font=`${weight} ${size}px ${font}`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y);}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function lines(s,maxW,font){ctx.font=font;const out=[];let cur='';for(const w of s.split(' ')){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){out.push(cur);cur=w;}else cur=t;}if(cur)out.push(cur);return out;}
function para(s,x,y,maxW,size,color,lh,weight=600,font=BODY,align='center'){const L=lines(s,maxW,`${weight} ${size}px ${font}`);ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';L.forEach((l,i)=>ctx.fillText(l,x,y+i*lh));return L.length;}
function makeLayer(fn){const c=document.createElement('canvas');c.width=W*2;c.height=H*2;const g=c.getContext('2d');g.scale(2,2);const old=ctx;ctx=g;fn();ctx=old;return c;}
function sep(a,b,wa,wb){const dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||.01,o=a.r+b.r-d;if(o<=0)return false;const nx=dx/d,ny=dy/d;a.x+=nx*o*wa;a.y+=ny*o*wa;b.x-=nx*o*wb;b.y-=ny*o*wb;return true;}
function neonV(text,x,y,color){const ch=[...text],h=ch.length*32+14,w=44;ctx.save();ctx.fillStyle='rgba(10,5,15,.88)';rr(x-w/2,y,w,h,6);ctx.fill();ctx.shadowColor=color;ctx.shadowBlur=14;ctx.strokeStyle=color;ctx.lineWidth=2.5;rr(x-w/2,y,w,h,6);ctx.stroke();ch.forEach((c,i)=>txt(c,x,y+23+i*32,26,color,'center',BODY,900));ctx.restore();}

let pops=[];
function pop(text,x,y,color=C.cream,size=22,life=1.2,tag=null){if(tag)pops=pops.filter(p=>p.tag!==tag);pops.push({text,x,y,t:0,color,size,life,tag,rise:tag?0:34});}
function updPops(dt){for(const p of pops){p.t+=dt;p.y-=p.rise*dt;}pops=pops.filter(p=>p.t<p.life);}
function drawPops(){for(const p of pops){const a=clamp((p.life-p.t)/.45,0,1);ctx.globalAlpha=a;ctx.font=`900 ${p.size}px ${BODY}`;const w=ctx.measureText(p.text).width;const x=clamp(p.x,w/2+8,W-w/2-8);ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=Math.max(3,p.size*.24);ctx.strokeStyle='rgba(10,6,18,.92)';ctx.strokeText(p.text,x,p.y);ctx.fillStyle=p.color;ctx.fillText(p.text,x,p.y);}ctx.globalAlpha=1;}
let shake=0;

// ---------- audio ----------
let AC=null,muted=false;
function initAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,d,type='square',vol=.07,to){if(muted||!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);}
const sfx={
  good(){tone(660,.09);setTimeout(()=>tone(990,.12),70);},
  bad(){tone(170,.22,'sawtooth',.06,90);},
  blip(){tone(880,.05,'square',.035);},
  chime(){[659,523,392].forEach((f,i)=>setTimeout(()=>tone(f,.3,'sine',.09),i*230));},
  octopus(){tone(1568,.14,'sine',.11);},
  splash(){tone(500,.2,'triangle',.08,110);},
  thunk(){tone(140,.12,'triangle',.12,70);},
  shout(v){tone(200+v*2.5,.35,'sawtooth',.05,380+v*4);}
};

// ---------- input ----------
const keys={};
const pointer={x:0,y:0,down:false,type:'mouse'};
function toL(e){const r=cvs.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}

// ---------- HUD ----------
function hud(st,scoreStr,rightStr){
  ctx.fillStyle='rgba(12,8,20,.94)';ctx.fillRect(0,0,W,56);
  txt(st.clock,16,29,19,C.amber,'left',MONO,400);
  txt(st.title,80,30,16,C.cream,'left',DISP,400);
  const low=!rightStr&&st.left<10;
  const r=rightStr??`${Math.max(0,Math.ceil(st.left))}s`;
  ctx.fillStyle=low?C.red:'#2a2040';rr(W-82,12,68,32,16);ctx.fill();
  txt(r,W-48,29,18,low?'#fff':C.cream,'center',MONO,400);
  txt(scoreStr,W-94,29,16,C.cream,'right',BODY,700);
  if(!rightStr){ctx.fillStyle=C.red;ctx.fillRect(0,54,W*clamp(st.left/st.dur,0,1),2);}
}
const verdict=(s,L)=>s<30?L[0]:s<55?L[1]:s<80?L[2]:L[3];

// =====================================================================
// 1. MTR SEAT WARS
// =====================================================================
const SITTERS=['😴','🧑‍💼','👩‍💻','🧓','👨‍🎓','👩','🧔','🤳','👩‍🦱','🧑‍🦲'];
const STATIONS=[['旺角','Mong Kok'],['油麻地','Yau Ma Tei'],['尖沙咀','Tsim Sha Tsui'],['金鐘','Admiralty'],['中環','Central'],['太子','Prince Edward'],['九龍塘','Kowloon Tong'],['鑽石山','Diamond Hill']];
const mtr={
  clock:'07:48',title:'MTR Seat Wars',zh:'港鐵搶位',dur:90,
  blurb:'Kwun Tong line, peak hour. At every station a seat opens up — and three aunties with shopping trolleys have already clocked it.',
  how:'<b>Move</b> with arrow keys / WASD, or press and drag. Touch a glowing <b>空位</b> (empty seat) before an auntie does. The train brakes at every station. Brace.',
  init(){
    this.pts=0;this.lost=0;this.seats=[];
    const ys=[142,196,250,304,456,510,564,618];
    for(const side of [0,1])for(const y of ys)this.seats.push({x:side?467:73,fx:side?428:112,y,side,who:pick(SITTERS),state:'full',g:0});
    this.p={x:270,y:390,vx:0,vy:0,r:15,bump:0,sit:0,seat:null};
    this.crowd=[];for(let i=0;i<9;i++)this.crowd.push({x:rand(150,390),y:rand(120,680),r:17,vx:0,vy:0,e:pick(['🧍','🧍‍♀️','🧍‍♂️','🙍','🙍‍♂️'])});
    this.poles=[{x:270,y:230,r:8},{x:270,y:540,r:8}];
    this.aunties=[];for(let i=0;i<3;i++)this.aunties.push(this.newAunty(rand(150,390),rand(130,660)));
    this.respawn=[];this.nextOpen=1.2;this.nextAnn=2.5;this.ann=null;this.swayT=0;this.swayDir=1;this.stI=ri(0,STATIONS.length-1);this.bcd=0;
    this.bg=makeLayer(()=>this.paintBg());
  },
  newAunty(x,y){return{x,y,r:18,hx:rand(150,390),hy:rand(130,660),target:null,react:rand(.25,.6),bonus:rand(-12,14)};},
  openSeat(){const f=this.seats.filter(s=>s.state==='full'&&s!==this.p.seat);if(!f.length)return;const s=pick(f);s.state='empty';s.g=0;sfx.blip();pop('空位!',s.x+(s.side?-34:34),s.y-24,C.jade,18);},
  update(dt){
    const k=this.elapsed/this.dur,p=this.p;
    this.nextAnn-=dt;
    if(this.nextAnn<=0){const[zh,en]=STATIONS[this.stI++%STATIONS.length];this.ann={zh,en,t:3.4};this.nextAnn=12;sfx.chime();this.swayT=1.1;this.swayDir=Math.random()<.5?-1:1;this.openSeat();this.openSeat();}
    if(this.ann){this.ann.t-=dt;if(this.ann.t<=0)this.ann=null;}
    this.swayT-=dt;
    const sway=this.swayT>0?this.swayDir*420:Math.sin(this.elapsed*1.4)*30;
    this.nextOpen-=dt;if(this.nextOpen<=0){this.openSeat();this.nextOpen=rand(2.1,3.1)-k*1.2;}
    for(const s of this.seats)s.g+=dt;
    // player
    if(p.sit>0){
      p.sit-=dt;
      if(p.sit<=0){const s=p.seat;s.who=pick(['👴','🤰','👵🏻','🧓']);p.x=s.fx+(s.side?-16:16);p.y=s.y;p.seat=null;pop('讓座 — gave it up to someone who needed it',270,s.y-40,C.cream,14,1.6);}
    }else{
      let ix=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0),iy=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);
      if(pointer.down){const dx=pointer.x-p.x,dy=pointer.y-p.y,d=Math.hypot(dx,dy);if(d>8){ix=dx/d;iy=dy/d;}else{ix=0;iy=0;}}
      const m=Math.hypot(ix,iy);if(m>0){ix/=m;iy/=m;}
      const sp=p.bump>0?130:240,a=Math.min(1,dt*12);
      p.vx+=(ix*sp-p.vx)*a;p.vy+=(iy*sp-p.vy)*a;
      p.x+=p.vx*dt+sway*.45*dt;p.y+=p.vy*dt;p.bump-=dt;
    }
    for(const c of this.crowd){c.vx=clamp((c.vx+rand(-80,80)*dt)*.97,-25,25);c.vy=clamp((c.vy+rand(-80,80)*dt)*.97,-25,25);c.x+=c.vx*dt+sway*.35*dt;c.y+=c.vy*dt;}
    // aunties
    const empties=this.seats.filter(s=>s.state==='empty');
    for(const a of this.aunties){
      if(a.target&&a.target.state!=='empty')a.target=null;
      if(!a.target){let best=null,bd=1e9;for(const s of empties){if(s.g<a.react)continue;if(this.aunties.some(o=>o!==a&&o.target===s))continue;const d=Math.hypot(s.fx-a.x,s.y-a.y);if(d<bd){bd=d;best=s;}}a.target=best;}
      const tx=a.target?a.target.fx:a.hx,ty=a.target?a.target.y:a.hy;
      const dx=tx-a.x,dy=ty-a.y,d=Math.hypot(dx,dy),sp=a.target?(125+k*80+a.bonus):40;
      if(d>2){a.x+=dx/d*Math.min(d,sp*dt);a.y+=dy/d*Math.min(d,sp*dt);}
      else if(!a.target){a.hx=rand(150,390);a.hy=rand(130,660);}
      if(a.target&&d<10){const s=a.target;s.state='full';s.who='👵';a.dead=true;this.lost++;sfx.bad();pop('Auntie wins 😤',s.x+(s.side?-60:60),s.y,C.red,17);this.respawn.push(1.6);}
    }
    this.aunties=this.aunties.filter(a=>!a.dead);
    for(let i=this.respawn.length-1;i>=0;i--){this.respawn[i]-=dt;if(this.respawn[i]<=0){this.respawn.splice(i,1);this.aunties.push(this.newAunty(Math.random()<.5?122:418,380));}}
    // collisions
    if(p.sit<=0){
      for(const c of this.crowd){if(sep(p,c,.75,.25)){p.bump=.25;if(this.bcd<=0){this.bcd=1.3;pop(pick(['唔該借借!','Excuse me!','Mind the backpack!','📱 (does not look up)','Ow, my Octopus card']),c.x,c.y-28,C.cream,14);}}}
      for(const a of this.aunties)sep(p,a,1,0);
      for(const o of this.poles)sep(p,o,1,0);
    }
    this.bcd-=dt;
    for(const a of this.aunties)for(const c of this.crowd)sep(c,a,1,0);
    for(let i=0;i<this.crowd.length;i++)for(let j=i+1;j<this.crowd.length;j++)sep(this.crowd[i],this.crowd[j],.5,.5);
    for(const c of this.crowd){for(const o of this.poles)sep(c,o,1,0);c.x=clamp(c.x,132,408);c.y=clamp(c.y,116,684);}
    p.x=clamp(p.x,104,436);p.y=clamp(p.y,112,690);
    if(p.sit<=0)for(const s of this.seats){if(s.state==='empty'&&Math.hypot(p.x-s.fx,p.y-s.y)<26){s.state='full';p.sit=.9;p.seat=s;this.pts++;sfx.good();pop('+1 坐低!',s.x+(s.side?-50:50),s.y-10,C.amber,22);break;}}
  },
  paintBg(){
    ctx.fillStyle='#161b26';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#232a38';ctx.fillRect(100,100,340,600);
    ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1;
    for(let y=110;y<700;y+=18){ctx.beginPath();ctx.moveTo(100,y);ctx.lineTo(440,y);ctx.stroke();}
    const ys=[142,196,250,304,456,510,564,618];
    for(const side of [0,1]){
      ctx.fillStyle='#3a4352';ctx.fillRect(side?440:0,100,100,600);
      ctx.fillStyle='#6d7888';ctx.fillRect(side?444:46,114,50,218);ctx.fillRect(side?444:46,428,50,218);
      for(const y of ys){const g=ctx.createLinearGradient(0,y-24,0,y+24);g.addColorStop(0,'#b9c3cf');g.addColorStop(1,'#8f9aa8');ctx.fillStyle=g;rr(side?445:47,y-23,48,46,8);ctx.fill();}
      // door
      ctx.fillStyle='#262c37';ctx.fillRect(side?440:60,344,40,72);
      ctx.fillStyle='#4b5566';ctx.fillRect(side?452:66,352,22,56);
      ctx.fillStyle=C.amber;ctx.fillRect(side?436:100,344,4,72);
    }
    // end walls with a Kwun Tong line map

if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{attract=null;});

// ---------- events ----------
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(!ov.hidden){if((k==='enter'||k===' ')&&document.activeElement&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();const b=ov.querySelector('[data-primary]');if(b)b.click();}return;}
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  keys[k]=true;
  if(mode==='play'&&cur){if(e.repeat&&(k===' '||k==='enter'))return;if(k===' ')cur.press?.();cur.key?.(k,true);}
});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();keys[k]=false;if(mode==='play'&&cur&&k===' ')cur.release?.();});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;pointer.down=false;});
cvs.addEventListener('contextmenu',e=>e.preventDefault());
cvs.addEventListener('pointerdown',e=>{
  const p=toL(e);pointer.x=p.x;pointer.y=p.y;pointer.type=e.pointerType;
  if(mode!=='play'||!cur)return;
  if(e.button===2){cur.alt?.();return;}
  pointer.down=true;try{cvs.setPointerCapture(e.pointerId);}catch(err){}
  cur.down?.(p.x,p.y,e.pointerType);cur.press?.();
});
cvs.addEventListener('pointermove',e=>{const p=toL(e);pointer.x=p.x;pointer.y=p.y;if(mode==='play'&&cur)cur.move?.(p.x,p.y,e.pointerType);});
function pUp(e){if(e.button===2)return;const was=pointer.down;pointer.down=false;if(mode!=='play'||!cur||!was)return;const p=toL(e);cur.up?.(p.x,p.y,e.pointerType);cur.release?.();}
cvs.addEventListener('pointerup',pUp);
cvs.addEventListener('pointercancel',e=>{pointer.down=false;if(mode==='play'&&cur)cur.release?.();});

// ---------- loop ----------
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  ctx.setTransform(viewK,0,0,viewK,0,0);ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0){shake-=dt;ctx.translate(rand(-5,5),rand(-5,5));}
  if(cur&&(mode==='play'||mode==='intro'||mode==='between')){
    if(mode==='play'){cur.elapsed+=dt;cur.left-=dt;cur.update(dt);updPops(dt);}
    cur.draw();drawPops();
    if(mode==='play'&&(cur.left<=0||cur.finished))endStage();
  }else drawAttract(dt);
  ctx.restore();
  requestAnimationFrame(frame);
}
showTitle();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
